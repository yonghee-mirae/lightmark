[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
backend = { version = "0.1.0", path = "../backend" }
# form_urlencoded, for percent-encoding a file path into a new window's `?file=` URL (docs/PLAN.md
# multi-window support) - already resolved via tauri's own dependency tree (Cargo.lock has 2.5.8),
# this just makes it a direct dependency since `tauri::Url` is re-exported but `form_urlencoded` isn't.
url = "2"
